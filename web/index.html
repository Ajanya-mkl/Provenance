<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Provenance console</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem("provenance.settings") || "{}");
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = saved.theme === "light" || saved.theme === "dark" ? saved.theme : light ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.solid = String(saved.solid === true);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
