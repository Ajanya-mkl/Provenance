warehouse:
  duckdb_path: "data/provenance.duckdb"
  schemas:
    bronze: "bronze"
    silver: "silver"
    gold: "gold"
    agent: "agent"

storage:
  base_path: "data"
  raw: "data/raw"
  bronze: "data/bronze"
  silver: "data/silver"
  gold: "data/gold"
  quarantine: "data/quarantine"

orchestration:
  weekly_pipeline_cron: "0 2 * * 1"

ingestion:
  # true: load the cached sample (data/raw/usaspending_sample.json) instead of
  # calling the USASpending API, so demo and CI runs are reproducible. The
  # env var PROVENANCE_USASPENDING_OFFLINE=true|false overrides this.
  usaspending_offline: false
